[package]
name = "squabble-creusot"
version = "0.1.0"
edition = "2021"
description = "Creusot contracts for the squabbler's load-bearing invariants — stated, not yet discharged"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell (hyperpolymath) <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/cicd-squabbler"
rust-version = "1.85"
# Verification-only: never published, never a runtime dependency of `squabble`.
publish = false

# Its own workspace root, deliberately. `creusot-std` is nightly-only and
# `creusot-std`/`creusot-contracts` pull an LGPL-2.1-or-later tree; putting
# either into the root workspace would drag it into the stable `--locked`
# build and `cargo audit`, which read one Cargo.lock for the whole workspace
# (the failure mode echidna measured and recorded in its CREUSOT-SETUP.adoc).
# Cargo therefore refuses to include this package in the root workspace, and
# `cargo test --workspace` at the root stays stable-only.
[workspace]

[features]
default = []
# Enables the contract-bearing module. Off by default so the crate also
# compiles on stable Rust (where `model` carries the same statements as
# ordinary functions plus `#[test]`s).
creusot = ["dep:creusot-std"]

[dependencies]
# The proof library ("creusot-contracts" before v0.9.0). Optional: stable
# builds resolve none of it. Version pairs with the Creusot release named in
# rust-toolchain.toml and in .github/workflows/creusot.yml — move all three
# together.
creusot-std = { version = "0.14", optional = true }

[dev-dependencies]
# Only for the stable-Rust mirror tests, which check that the model in
# `src/model.rs` agrees with the real implementation in `squabble-core`.
squabble-core = { path = "../../crates/squabble-core" }
