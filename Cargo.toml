[workspace]
resolver = "2"
members = [
    "crates/squabble-core",
    "crates/squabble-fight",
    "crates/squabble-cli",
    "crates/squabble-app",
    "crates/squabble-forge",
]
# standards' governance "JS runtimes" job checks its js-runtimes crate out at
# .standards-js/ inside this checkout and `cargo install`s it from there. It is
# an independent package, not a member of this workspace; without this cargo
# refuses to build it (governance run 39253292198, 2026-10-19; root fix is
# hyperpolymath/standards#1299, after which this is harmless).
# `verification/squabble-creusot` is deliberately outside this workspace too: it
# is a nightly-only Creusot artefact with its own Cargo.lock, so the stable
# `--locked` build and `cargo audit` here never resolve `creusot-std`.
exclude = [".standards-js", "verification"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Jonathan D.A. Jewell (hyperpolymath) <j.d.a.jewell@open.ac.uk>"]
repository = "https://github.com/hyperpolymath/cicd-squabbler"
rust-version = "1.85"

[workspace.dependencies]
squabble-core = { path = "crates/squabble-core" }
squabble-fight = { path = "crates/squabble-fight" }
squabble-forge = { path = "crates/squabble-forge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
