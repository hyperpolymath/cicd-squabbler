# SPDX-License-Identifier: MPL-2.0
# This workflow is managed by gh actions-lock.
name: Secret Scanner
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# Current pinned reusable declares contents:read for all three scanner jobs.
# The caller must not reintroduce obsolete actions:read / SARIF write grants.
# A manual dispatch offers a fresh canary when a prior run had zero jobs.
permissions:
  contents: read
# Single secret scanner. The standards reusable runs gitleaks (+ a Rust-secrets
# check). An inline TruffleHog job previously lived here, but the reusable
# DELIBERATELY retired TruffleHog as redundant (gitleaks gives sufficient
# coverage at lower cost — see the reusable's header). Re-adding it was
# duplicated work, not extra coverage, so it has been removed. See
# .github/workflows/README.adoc.
jobs:
  scan:
    uses: metadatastician/standards/.github/workflows/secret-scanner-reusable.yml@8e48b1caade08a552646adeab66558ac43b4360d
    # No `secrets:` block, deliberately: secret-scanner-reusable.yml @75bd5994
    # declares no caller secrets and reads no `secrets.*` context, so
    # `secrets: inherit` only forwarded every repository secret to a workflow
    # that never asked for one (WH008, zizmor secrets-inherit).
    permissions:
      contents: read
