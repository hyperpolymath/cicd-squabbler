# SPDX-License-Identifier: MPL-2.0
# ARENA SESSION SCRATCH -- NOT FOR MERGE. Deleted before this branch is proposed.
#
# Why this exists: the authoring sandbox has no Rust toolchain and cannot read job
# logs (they are served from a blob host it cannot reach), so `cargo fmt`,
# `clippy -D warnings` and `cargo test` could not be observed at all. PR #110 merged
# ~1,800 lines of Rust its author never compiled, and every one of that PR's own CI
# runs was `startup_failure`, so nothing ever exercised it. This probe runs the same
# gates, with the same cargo arguments, as standards' rust-ci-reusable.yml and publishes
# their output as workflow annotations -- the one channel the checks API serves
# without the log (the same technique MetaManifold-WebUI's ci.yml already uses).
#
# Read-only (contents: read). Carries NO `uses:`, so the Actions policy cannot refuse it.
name: Arena Rust Probe

on:
  push:
    branches: ['arena/**']

permissions:
  contents: read

concurrency:
  group: arena-rust-probe-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_TERM_PROGRESS_WHEN: never

defaults:
  run:
    shell: bash

jobs:
  fmt:
    name: probe / fmt (emits the rustfmt patch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out without actions/checkout
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git init -q .
          git remote add origin "https://github.com/${REPO}.git"
          git -c http.extraheader="${AUTH}" fetch -q --depth 1 origin "${SHA}"
          git checkout -q FETCH_HEAD
          echo "checked out ${SHA}"

      - name: Install the same toolchain the estate CI installs (stable + rustfmt)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable
          echo "::notice title=fmt toolchain::$(rustc --version) | $(cargo --version) | $(rustfmt --version)"

      - name: cargo fmt --all -- --check (exact estate command)
        id: check
        run: |
          set +e
          cargo fmt --all -- --check > "$RUNNER_TEMP/fmt-check.log" 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "::notice title=fmt check exit code::$rc ($(grep -c '^Diff in' "$RUNNER_TEMP/fmt-check.log") diff hunks)"
          exit 0

      - name: Apply rustfmt and publish the resulting patch (gzip + base64, chunked)
        run: |
          set +e
          emit() { # emit TITLE FILE MODE(text|b64) MAXCHUNKS
            local title="$1" file="$2" mode="$3" max="${4:-27}" dir total n f lvl msg
            dir="$(mktemp -d)"
            if [ "$mode" = b64 ]; then split -b 3000 -d -a 3 "$file" "$dir/c."; else split -C 3000 -d -a 3 "$file" "$dir/c."; fi
            total=$(find "$dir" -type f | wc -l); n=0
            for f in "$dir"/c.*; do
              n=$((n+1)); [ "$n" -gt "$max" ] && break
              if [ "$n" -le 9 ]; then lvl=error; elif [ "$n" -le 18 ]; then lvl=warning; else lvl=notice; fi
              msg="$(sed -e 's/%/%25/g' "$f" | sed -e ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g')"
              echo "::${lvl} title=${title} ${n}/${total}::${msg}"
            done
            if [ "$total" -gt "$max" ]; then echo "::notice title=${title} TRUNCATED::${total} chunks; only ${max} emitted"; fi
          }
          cargo fmt --all
          git diff --stat > "$RUNNER_TEMP/fmt.stat"
          git diff > "$RUNNER_TEMP/fmt.patch"
          bytes=$(wc -c < "$RUNNER_TEMP/fmt.patch")
          echo "::notice title=fmt patch::$(tail -n 1 "$RUNNER_TEMP/fmt.stat") | patch bytes=${bytes}"
          if [ "$bytes" -gt 0 ]; then
            echo "::notice title=fmt.stat::$(head -c 3000 "$RUNNER_TEMP/fmt.stat" | sed -e 's/%/%25/g' | sed -e ':a;N;$!ba;s/\n/%0A/g')"
            gzip -9 -c "$RUNNER_TEMP/fmt.patch" | base64 -w0 > "$RUNNER_TEMP/fmt.patch.gz.b64"
            echo "::notice title=fmt patch b64::$(wc -c < "$RUNNER_TEMP/fmt.patch.gz.b64") base64 bytes (gz)"
            emit "fmt.patch.gz.b64" "$RUNNER_TEMP/fmt.patch.gz.b64" b64 22
          fi

      - name: Gate result
        env:
          RC: ${{ steps.check.outputs.rc }}
        run: 'exit "${RC:-1}"'

  clippy:
    name: probe / clippy (-D warnings)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out without actions/checkout
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git init -q .
          git remote add origin "https://github.com/${REPO}.git"
          git -c http.extraheader="${AUTH}" fetch -q --depth 1 origin "${SHA}"
          git checkout -q FETCH_HEAD

      - name: Install the same toolchain the estate CI installs (stable + clippy)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --component clippy --no-self-update
          rustup default stable
          echo "::notice title=clippy toolchain::$(rustc --version) | $(cargo clippy --version)"

      - name: cargo clippy --locked --all-targets -- -D warnings (exact estate command, short format)
        id: clippy
        run: |
          set +e
          emit() {
            local title="$1" file="$2" max="${3:-27}" dir total n f lvl msg
            dir="$(mktemp -d)"; split -C 3000 -d -a 3 "$file" "$dir/c."
            total=$(find "$dir" -type f | wc -l); n=0
            for f in "$dir"/c.*; do
              n=$((n+1)); [ "$n" -gt "$max" ] && break
              if [ "$n" -le 9 ]; then lvl=error; elif [ "$n" -le 18 ]; then lvl=warning; else lvl=notice; fi
              msg="$(sed -e 's/%/%25/g' "$f" | sed -e ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g')"
              echo "::${lvl} title=${title} ${n}/${total}::${msg}"
            done
            if [ "$total" -gt "$max" ]; then echo "::notice title=${title} TRUNCATED::${total} chunks; only ${max} emitted"; fi
          }
          cargo clippy --locked --all-targets --message-format=short -- -D warnings > "$RUNNER_TEMP/clippy.log" 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "::notice title=clippy exit code::$rc | errors=$(grep -c ': error' "$RUNNER_TEMP/clippy.log") warnings=$(grep -c ': warning' "$RUNNER_TEMP/clippy.log")"
          grep -E ': (error|warning)|^error|^warning|could not compile' "$RUNNER_TEMP/clippy.log" | grep -v '^warning: unused manifest' > "$RUNNER_TEMP/clippy.short" || true
          [ -s "$RUNNER_TEMP/clippy.short" ] || tail -c 20000 "$RUNNER_TEMP/clippy.log" > "$RUNNER_TEMP/clippy.short"
          emit "clippy" "$RUNNER_TEMP/clippy.short" 25
          exit 0

      - name: Gate result
        env:
          RC: ${{ steps.clippy.outputs.rc }}
        run: 'exit "${RC:-1}"'

  test:
    name: probe / test (--all-targets, no-fail-fast)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out without actions/checkout
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${TOKEN}" | base64 -w0)"
          git init -q .
          git remote add origin "https://github.com/${REPO}.git"
          git -c http.extraheader="${AUTH}" fetch -q --depth 1 origin "${SHA}"
          git checkout -q FETCH_HEAD

      - name: Install the same toolchain the estate CI installs (stable)
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          echo "::notice title=test toolchain::$(rustc --version) | $(cargo --version)"

      - name: cargo test --locked --all-targets --no-fail-fast
        id: test
        run: |
          set +e
          emit() {
            local title="$1" file="$2" max="${3:-27}" dir total n f lvl msg
            dir="$(mktemp -d)"; split -C 3000 -d -a 3 "$file" "$dir/c."
            total=$(find "$dir" -type f | wc -l); n=0
            for f in "$dir"/c.*; do
              n=$((n+1)); [ "$n" -gt "$max" ] && break
              if [ "$n" -le 9 ]; then lvl=error; elif [ "$n" -le 18 ]; then lvl=warning; else lvl=notice; fi
              msg="$(sed -e 's/%/%25/g' "$f" | sed -e ':a;N;$!ba;s/\r/%0D/g;s/\n/%0A/g')"
              echo "::${lvl} title=${title} ${n}/${total}::${msg}"
            done
            if [ "$total" -gt "$max" ]; then echo "::notice title=${title} TRUNCATED::${total} chunks; only ${max} emitted"; fi
          }
          cargo test --locked --all-targets --no-fail-fast > "$RUNNER_TEMP/test.log" 2>&1
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          passed=$(grep -c '^test .* \.\.\. ok$' "$RUNNER_TEMP/test.log")
          failed=$(grep -c '^test .* \.\.\. FAILED$' "$RUNNER_TEMP/test.log")
          echo "::notice title=test exit code::$rc | passed=${passed} failed=${failed}"
          grep -E '^test result:' "$RUNNER_TEMP/test.log" | sort | uniq -c | sed 's/^ *//' > "$RUNNER_TEMP/test.results" || true
          echo "::notice title=test results::$(sed -e 's/%/%25/g' "$RUNNER_TEMP/test.results" | sed -e ':a;N;$!ba;s/\n/%0A/g')"
          awk '
            /^---- .* ----$/ { p = 1 }
            /^failures:$/ { p = 1 }
            /^test result:/ { print; p = 0; next }
            /^error(\[|:)/ { print }
            /^test .* FAILED$/ { print }
            p { print }
          ' "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/test.fail"
          if [ -s "$RUNNER_TEMP/test.fail" ]; then emit "test.fail" "$RUNNER_TEMP/test.fail" 24; fi
          if [ "$rc" -ne 0 ] && [ ! -s "$RUNNER_TEMP/test.fail" ]; then
            tail -c 20000 "$RUNNER_TEMP/test.log" > "$RUNNER_TEMP/test.tail"; emit "test.tail" "$RUNNER_TEMP/test.tail" 9
          fi
          exit 0

      - name: Gate result
        env:
          RC: ${{ steps.test.outputs.rc }}
        run: 'exit "${RC:-1}"'
