#
# Release workflow, triggered by a version tag (v*).
# Builds a static `squabble` binary for x86_64-unknown-linux-musl with the
# workspace MSRV toolchain, stages it with a SHA256SUMS file, attests build
# provenance for both files (OIDC + Sigstore), and publishes them on the
# GitHub Release for the tag. Every step fails closed: a missing file stops
# the run before anything is attested or published.
#
# Verify a downloaded binary with:
#   sha256sum -c SHA256SUMS
#   gh attestation verify squabble-x86_64-linux-musl --repo hyperpolymath/cicd-squabbler
name: Release
on:
  push:
    tags:
      - 'v*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    name: Build squabble (x86_64-linux-musl)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Untagged dtolnay/rust-toolchain master commit (2026-08-04, merge of #182);
      # an ancestor of the moving `v1` branch. Pinned by SHA, so no tag applies.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master 2026-08-04
        with:
          toolchain: 1.85.0
          targets: x86_64-unknown-linux-musl
      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build release binary
        run: cargo build --locked --release -p squabble-cli --target x86_64-unknown-linux-musl
      - name: Stage dist/
        run: |
          mkdir -p dist
          cp target/x86_64-unknown-linux-musl/release/squabble dist/squabble-x86_64-linux-musl
          cd dist
          sha256sum squabble-x86_64-linux-musl > SHA256SUMS
      - name: Require both release files
        run: |
          for f in dist/squabble-x86_64-linux-musl dist/SHA256SUMS; do
            test -s "$f" || { echo "::error::missing or empty release file: $f"; exit 1; }
          done
          cd dist
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          retention-days: 5
  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write       # create the release and upload its assets
      id-token: write       # mint the OIDC token the provenance attestation is signed with
      attestations: write   # store the build-provenance attestation
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist
      - name: Refuse an empty or incomplete dist/
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::dist/ is empty; nothing to attest or release"
            exit 1
          fi
          for f in dist/squabble-x86_64-linux-musl dist/SHA256SUMS; do
            test -s "$f" || { echo "::error::missing or empty release file: $f"; exit 1; }
          done
          cd dist
          sha256sum -c SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/*'
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
